    <path d="M70 18 C78 39, 82 60, 81 91" fill="none" stroke="#EAF7FB" stroke-width="1.8" opacity="0.78"/>
    <path d="M47 82 C54 80, 61 82, 67 86 C72 89, 78 88, 82 84 C79 93, 70 99, 60 99 C53 99, 47 96, 43 91Z" fill="#6D9E19" opacity="0.9"/>
