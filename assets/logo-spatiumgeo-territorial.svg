<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 122" role="img" aria-labelledby="title desc">
  <title id="title">SPATIUM GEO</title>
  <desc id="desc">Logo de SPATIUM GEO con el descriptor Territorial Intelligence</desc>
  <defs>
    <radialGradient id="globe" cx="35%" cy="25%" r="72%">
      <stop offset="0" stop-color="#20384A"/>
      <stop offset="0.48" stop-color="#081A28"/>
      <stop offset="1" stop-color="#020A12"/>
    </radialGradient>
    <linearGradient id="orbitGreen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#B7E94D"/>
