    <path d="M31 49 C47 34, 77 27, 99 33" fill="none" stroke="#EAF7FB" stroke-width="2.2" opacity="0.88"/>
    <path d="M29 65 C49 53, 80 47, 102 49" fill="none" stroke="#EAF7FB" stroke-width="2.2" opacity="0.9"/>
